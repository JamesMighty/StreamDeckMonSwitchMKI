---
- name: Build backend
  hosts: host-win

  tasks:
    - name: Build backend
      ansible.windows.win_shell: "{{ hostvars[inventory_hostname].devenv_path }} StreamDeckMonSwitchMKI.sln /Build {{ mode }}"
      args:
        chdir: "{{ hostvars[inventory_hostname].plugin_home }}"
      register: build_result
      failed_when:
        - mode is undefined or build_result.rc != 0
      when: hostvars['localhost'].backend_changed | default(true) | bool
