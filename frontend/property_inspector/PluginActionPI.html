<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover">
    <meta name=apple-mobile-web-app-capable content=yes>
    <meta name=apple-mobile-web-app-status-bar-style content=black>
    <title>StreamDeckMonSwitchMKI Settings</title>
    <script src="code.jquery.com_jquery-3.7.1.min.js"></script>
    <script src="plugin-action-pi.js"></script>
    <script src="sdpi-components.js"></script>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item" id="dvMode" title="How the button behaves. Set applies a fixed value, Toggle switches between two values, Loop cycles through them, Scroll adjusts continuously.">
            <sdpi-item label="Action Mode">
                <sdpi-radio id="mode_selection" setting="actionMode" default="set" columns="3">
                    <option value="set">Set</option>
                    <option value="toggle">Toggle</option>
                    <option value="loop">Loop</option>
                </sdpi-radio>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvStepSize" style="display:none" title="How much the value changes with each scroll tick.">
            <sdpi-item label="Step Size">
                <div style="display:flex;align-items:center;gap:8px;width:100%">
                    <sdpi-range id="step_size_slider" setting="stepSize" min="1" max="100" step="1" style="flex:1"></sdpi-range>
                    <sdpi-textfield id="step_size_input" setting="stepSize" style="width:60px"></sdpi-textfield>
                </div>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvWrapAround" style="display:none" title="When enabled, scrolling past the minimum or maximum wraps around to the opposite end.">
            <sdpi-item label="Wrap Around">
                <sdpi-checkbox setting="wrapAround">Wrap at min/max</sdpi-checkbox>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvTargetValue" style="display:none" title="The value the button applies when pressed (Set mode).">
            <sdpi-item label="Target Value">
                <sdpi-textfield id="target_value_input" setting="targetValue" placeholder="Enter target value"></sdpi-textfield>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvMonitors" title="Select which monitors this button controls.">
            <sdpi-item label="Monitors">
                <sdpi-checkbox-list-custom id="monitors_selection" setting="monitors" columns="2" datasource="getMonitors" loading="Fetching monitors..." hot-reload>

                </sdpi-checkbox-list-custom>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvProperties" title="Select which monitor properties (brightness, contrast, input, etc.) this button controls.">
            <sdpi-item label="VCP Properties">
                <sdpi-checkbox-list-custom id="properties_selection" setting="properties" columns="2" datasource="getProperties">

                </sdpi-checkbox-list-custom>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvValues" title="Select the discrete values used by Toggle and Loop modes.">
            <sdpi-item label="VCP Values">
                <sdpi-checkbox-list-custom id="values_selection" setting="values" columns="2" datasource="getValues" exclusive>

                </sdpi-checkbox-list-custom>
            </sdpi-item>
        </div>
    </div>
</body>
</html>
