<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover">
    <meta name=apple-mobile-web-app-capable content=yes>
    <meta name=apple-mobile-web-app-status-bar-style content=black>
    <title>StreamDeckMonSwitchMKI Settings</title>
    <script src="code.jquery.com_jquery-3.7.1.min.js"></script>
    <script>
        // Capture the PI's WebSocket (created by sdpi-components) so we can send
        // custom messages to the plugin and listen for getVcpInfo replies.
        // We patch the WebSocket constructor BEFORE the bundle loads so we grab
        // the single connection the bundle creates — no second registration.
        var _piSocket = null;
        var _OrigWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
            var ws = protocols !== undefined ? new _OrigWebSocket(url, protocols) : new _OrigWebSocket(url);
            if (!_piSocket) {
                _piSocket = ws;
                ws.addEventListener('message', function(ev) {
                    try {
                        var msg = JSON.parse(ev.data);
                        if (msg.event === 'sendToPropertyInspector' && msg.payload && msg.payload.event === 'getVcpInfo') {
                            handleVcpInfo(msg.payload.items);
                        }
                    } catch(e) {}
                });
            }
            return ws;
        };
        window.WebSocket.prototype = _OrigWebSocket.prototype;
        window.WebSocket.CONNECTING = _OrigWebSocket.CONNECTING;
        window.WebSocket.OPEN = _OrigWebSocket.OPEN;
        window.WebSocket.CLOSING = _OrigWebSocket.CLOSING;
        window.WebSocket.CLOSED = _OrigWebSocket.CLOSED;

        function sendToPlugin(payload) {
            if (_piSocket && _piSocket.readyState === _OrigWebSocket.OPEN) {
                _piSocket.send(JSON.stringify({
                    event: 'sendToPlugin',
                    action: 'com.elgato.streamdeck.streamdeckmonswitch.monitorpluginaction',
                    context: _piUUID,
                    payload: payload
                }));
            }
        }

        // Capture the PI's UUID when the Stream Deck app invokes the bootstrap
        // (the bundle calls any pre-existing handler first).
        var _piUUID = null;
        window.connectElgatoStreamDeckSocket = function(port, uuid, registerEvent, info, actionInfo) {
            _piUUID = uuid;
        };

        var _vcpInfo = [];
        var _isContinuous = false;
        var _maxValue = 100;

        function handleVcpInfo(items) {
            _vcpInfo = items || [];
            updateModeUI();
        }

        function updateModeUI() {
            // Determine if any selected property is continuous.
            _isContinuous = _vcpInfo.some(function(item) { return item.type === 'continuous'; });
            if (_isContinuous) {
                var continuousItem = _vcpInfo.find(function(item) { return item.type === 'continuous'; });
                _maxValue = continuousItem.maxValue || 100;
            }

            var modeRadio = document.getElementById('mode_selection');
            var valuesSection = document.getElementById('dvValues');

            if (!modeRadio) return;

            if (_isContinuous) {
                // Continuous: show set (target), scrollUp, scrollDown. No VCP values list.
                modeRadio.innerHTML = '<option value="set">Set</option><option value="scrollUp">Scroll Up</option><option value="scrollDown">Scroll Down</option>';
                if (valuesSection) valuesSection.style.display = 'none';
                // Update step size slider max
                var stepSlider = document.getElementById('step_size_slider');
                if (stepSlider) stepSlider.max = _maxValue;
            } else {
                // Discrete: show set, toggle, loop. Values list applies.
                modeRadio.innerHTML = '<option value="set">Set</option><option value="toggle">Toggle</option><option value="loop">Loop</option>';
                if (valuesSection) valuesSection.style.display = '';
            }

            // If the currently saved mode is not valid for this property type,
            // fall back to 'set' so the radio always shows a checked option.
            var validModes = _isContinuous ? ['set', 'scrollUp', 'scrollDown'] : ['set', 'toggle', 'loop'];
            var currentMode = modeRadio.value || 'set';
            if (validModes.indexOf(currentMode) === -1) {
                modeRadio.value = 'set';
            }

            applyModeVisibility();
        }

        // Show/hide step-size, wrap-around and target-value sections based on
        // the currently selected mode and whether the property is continuous.
        function applyModeVisibility() {
            var modeRadio = document.getElementById('mode_selection');
            var stepSection = document.getElementById('dvStepSize');
            var wrapSection = document.getElementById('dvWrapAround');
            var targetSection = document.getElementById('dvTargetValue');
            if (!modeRadio) return;

            var mode = modeRadio.value || 'set';

            if (_isContinuous) {
                if (mode === 'set') {
                    // Continuous set: only the target value input is relevant.
                    if (stepSection) stepSection.style.display = 'none';
                    if (wrapSection) wrapSection.style.display = 'none';
                    if (targetSection) targetSection.style.display = '';
                } else {
                    // scrollUp / scrollDown: step size + wrap around, no target input.
                    if (stepSection) stepSection.style.display = '';
                    if (wrapSection) wrapSection.style.display = '';
                    if (targetSection) targetSection.style.display = 'none';
                }
            } else {
                // Discrete modes never use step size, wrap around or target value.
                if (stepSection) stepSection.style.display = 'none';
                if (wrapSection) wrapSection.style.display = 'none';
                if (targetSection) targetSection.style.display = 'none';
            }
        }
    </script>
    <script src="sdpi-components.js"></script>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item" id="dvMode" title="How the button behaves. Set applies a fixed value, Toggle switches between two values, Loop cycles through them, Scroll adjusts continuously.">
            <sdpi-item label="Action Mode">
                <sdpi-radio id="mode_selection" setting="actionMode" default="set" columns="3">
                    <option value="set">Set</option>
                    <option value="toggle">Toggle</option>
                    <option value="loop">Loop</option>
                </sdpi-radio>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvStepSize" style="display:none" title="How much the value changes with each scroll tick.">
            <sdpi-item label="Step Size">
                <div style="display:flex;align-items:center;gap:8px;width:100%">
                    <sdpi-range id="step_size_slider" setting="stepSize" min="1" max="100" step="1" style="flex:1"></sdpi-range>
                    <sdpi-textfield id="step_size_input" setting="stepSize" style="width:60px"></sdpi-textfield>
                </div>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvWrapAround" style="display:none" title="When enabled, scrolling past the minimum or maximum wraps around to the opposite end.">
            <sdpi-item label="Wrap Around">
                <sdpi-checkbox setting="wrapAround">Wrap at min/max</sdpi-checkbox>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvTargetValue" style="display:none" title="The value the button applies when pressed (Set mode).">
            <sdpi-item label="Target Value">
                <sdpi-textfield id="target_value_input" setting="targetValue" placeholder="Enter target value"></sdpi-textfield>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvMonitors" title="Select which monitors this button controls.">
            <sdpi-item label="Monitors">
                <sdpi-checkbox-list-custom id="monitors_selection" setting="monitors" columns="2" datasource="getMonitors" loading="Fetching monitors..." hot-reload>

                </sdpi-checkbox-list-custom>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvProperties" title="Select which monitor properties (brightness, contrast, input, etc.) this button controls.">
            <sdpi-item label="VCP Properties">
                <sdpi-checkbox-list-custom id="properties_selection" setting="properties" columns="2" datasource="getProperties">

                </sdpi-checkbox-list-custom>
            </sdpi-item>
        </div>
        <div class="sdpi-item" id="dvValues" title="Select the discrete values used by Toggle and Loop modes.">
            <sdpi-item label="VCP Values">
                <sdpi-checkbox-list-custom id="values_selection" setting="values" columns="2" datasource="getValues" exclusive>

                </sdpi-checkbox-list-custom>
            </sdpi-item>
        </div>
    </div>
    <script>
        // Request VCP info when properties change, and sync the mode UI.
        (function () {
            var propertiesList = document.getElementById('properties_selection');
            var modeRadio = document.getElementById('mode_selection');
            var valuesList = document.getElementById('values_selection');

            // When properties change, request VCP info from the plugin.
            if (propertiesList) {
                propertiesList.addEventListener('valuechange', function() {
                    setTimeout(function() { sendToPlugin({ event: 'getVcpInfo' }); }, 500);
                });
            }

            // Sync exclusive attribute on values list based on mode, and
            // update section visibility whenever the mode changes.
            function syncExclusivity() {
                var mode = modeRadio.value || 'set';
                if (mode === 'set' && !_isContinuous) {
                    valuesList.setAttribute('exclusive', '');
                } else {
                    valuesList.removeAttribute('exclusive');
                }
                applyModeVisibility();
            }

            if (modeRadio) {
                modeRadio.addEventListener('valuechange', syncExclusivity);
            }

            // Initial sync after components load.
            customElements.whenDefined('sdpi-radio').then(function () {
                setTimeout(function() {
                    syncExclusivity();
                    sendToPlugin({ event: 'getVcpInfo' });
                }, 200);
            });
        })();
    </script>
</body>
</html>
